<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Driver - Open Street Map Navigation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            overflow: hidden;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-width: 280px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .controls h3 {
            margin-bottom: 15px;
            color: #00d4ff;
            font-size: 18px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
            background: #333;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        
        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-width: 250px;
            z-index: 1000;
        }
        
        .status {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .destination-marker {
            width: 20px;
            height: 20px;
            background: #ff4444;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
        }
        
        .car-icon {
            transition: all 0.3s ease;
        }
        
        .popup-content {
            font-size: 14px;
            text-align: center;
        }
        
        .speed-display {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }
        
        .fuel-indicator {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        
        .navigation-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            min-width: 250px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .navigation-panel h4 {
            margin: 0 0 10px 0;
            color: #00d4ff;
            font-size: 14px;
        }
        
        .road-instruction {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 12px;
        }
        
        .road-instruction .arrow {
            margin-right: 8px;
            font-size: 16px;
            color: #00d4ff;
        }
        
        .road-instruction .road-name {
            flex: 1;
            color: #ccc;
        }
        
        .road-instruction .distance {
            color: #888;
            font-size: 11px;
        }

        #navigation-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 25px;
            z-index: 1001;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: white;
            min-width: 350px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #navigation-display.visible {
            opacity: 1;
        }

        .nav-icon {
            font-size: 48px;
            margin-right: 20px;
            color: #00d4ff;
        }

        .nav-details .nav-distance {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-details .nav-road {
            font-size: 16px;
            color: #ccc;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            min-width: 500px;
            max-width: 80%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            color: #ff4444;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .modal-content pre {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            color: #ddd;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .modal-content button {
            width: auto;
            padding: 10px 20px;
            margin-top: 20px;
            float: right;
        }

        #commandPrompt .modal-content {
            background: #111;
            border-color: #444;
            min-width: 600px;
        }
        
        #commandPrompt h3 {
            color: #00d4ff;
        }

        #commandInput {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }

        #commandOutput {
            margin-top: 15px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            min-height: 50px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }

    </style>
</head>
<body>
    <div id="navigation-display">
        <div class="nav-icon" id="navIcon">↑</div>
        <div class="nav-details">
            <div class="nav-distance" id="navDistance"></div>
            <div class="nav-road" id="navRoad"></div>
        </div>
    </div>

    <div id="map"></div>
    
    <div class="controls" id="controlsPanel">
        <h3>AI Driver Controls</h3>
        
        <div class="control-group">
            <label for="cityInput">Teleport to City:</label>
            <input type="text" id="cityInput" placeholder="Enter city name..." style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #333; background: #222; color: white;">
            <button id="teleportBtn" style="margin-top: 5px;">Teleport</button>
        </div>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="clickTeleportToggle"> Click-to-Teleport Mode
            </label>
        </div>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="followCarToggle"> Follow Car Mode
            </label>
        </div>
        
        <div class="control-group">
            <label for="speedSlider">Cruising Speed: <span id="speedValue">50</span> km/h</label>
            <input type="range" id="speedSlider" min="10" max="10000" value="50">
        </div>
        
        <div class="control-group">
            <label for="drivingStyle">Driving Style:</label>
            <select id="drivingStyle" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #333; background: #222; color: white;">
                <option value="normal">Normal</option>
                <option value="cautious">Cautious</option>
                <option value="aggressive">Aggressive</option>
                <option value="drunk">Drunk Mode</option>
                <option value="chaotic">Chaotic</option>
                <option value="fast">Fast</option>
                <option value="super-aggressive">Super Aggressive</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="fuelToggle"> Limited Fuel Mode
            </label>
        </div>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="disastersToggle"> Enable Car Disasters
            </label>
        </div>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="instantAccelerationToggle"> Instant Acceleration Mode
            </label>
        </div>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="spawnAIBtn"> Spawn AI Drivers
            </label>
        </div>

        <!-- New compact / toggle all UI controls -->
        <div class="control-group" style="margin-top:8px;">
            <label>
                <input type="checkbox" id="compactModeToggle"> Compact UI Mode
            </label>
            <button id="toggleAllPanelsBtn" style="margin-top:8px; background: linear-gradient(45deg,#ff9a00,#ff6b6b);">Toggle All Panels</button>
        </div>
        
        <button id="stopBtn">Stop AI Driver</button>
        <button id="resetBtn">Reset Position</button>
        
        <div class="fuel-indicator">
            <span>Fuel: <span id="fuelDisplay">∞ Unlimited</span></span>
        </div>
        <div class="fuel-indicator">
            <span>Health: <span id="healthDisplay">100%</span></span>
        </div>
    </div>
    
    <div class="info-panel">
        <div class="status">
            <strong>Status:</strong> <span id="statusText">Ready - Click anywhere to set destination</span>
        </div>
        <div class="speed-display" id="currentSpeed">0 km/h</div>
        <div style="font-size: 12px; color: #888; margin-top: 5px;">
            Distance: <span id="distanceText">-</span> | ETA: <span id="etaText">-</span>
        </div>
        <div style="font-size: 12px; color: #888; margin-top: 5px;">
            Location: <span id="locationText">North Pole</span>
        </div>
    </div>
    
    <div class="navigation-panel" style="display: none;">
        <h4>Next Roads</h4>
        <div id="roadInstructions"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="importmap">
    {
        "imports": {
            "openscenegraph": "https://cdn.jsdelivr.net/npm/osg@3.6.5/build/osg.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>

    <div id="errorModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="errorTitle">An Error Occurred</h3>
            <pre id="errorDetails"></pre>
            <button id="errorCloseBtn">Close</button>
        </div>
    </div>
    
    <div id="commandPrompt" class="modal-overlay" style="display: none; align-items: flex-start; padding-top: 10vh;">
        <div class="modal-content">
            <h3>Admin Command Prompt</h3>
            <input type="text" id="commandInput" placeholder="Type a command and press Enter (e.g., help)">
            <div id="commandOutput"></div>
        </div>
    </div>
</body>
</html>
